<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iframe</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
text-align:center;
}

iframe{
width:100%;
height:400px;
border:none;
border-radius:10px;
margin-top:20px;
}

a{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#0a66ff;
}

</style>

</head>

<body>

<div class="card">

<h1>Iframe Example</h1>

<p>Embedding Google inside the page:</p>

<iframe src="https://www.wikipedia.org"></iframe>

<br>

<a href="index.html">← Back to Home</a>

</div>

</body>

</html>
