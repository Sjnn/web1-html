<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buttons</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
text-align:center;
}

button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.primary{
background:#0a66ff;
color:white;
}

.success{
background:#28a745;
color:white;
}

.danger{
background:#dc3545;
color:white;
}

a{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#0a66ff;
}

</style>

</head>

<body>

<div class="card">

<h1>Buttons</h1>

<button class="primary">Primary</button>
<button class="success">Success</button>
<button class="danger">Danger</button>

<br>

<a href="index.html">← Back to Home</a>

</div>

</body>

</html>
