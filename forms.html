<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forms</title>

<link rel="icon" href="media/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:40px;
transition:0.3s;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}


input, select, form button{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

form button{
background:#0a66ff;
color:white;
border:none;
cursor:pointer;
}

form button:hover{
background:#004bb5;
}

a{
text-decoration:none;
color:#0a66ff;
}

/* dark mode */
body.dark{
background:#121212;
color:white;
}

body.dark .card{
background:#1e1e1e;
}

body.dark input,
body.dark select{
background:#2a2a2a;
color:white;
border-color:#444;
}


#themeToggle{
position:fixed;
top:20px;
right:20px;
font-size:28px;
background:none;
border:none;
cursor:pointer;
z-index:1000;
}

</style>

</head>

<body>

<button id="themeToggle" onclick="toggleTheme()">🌙</button>

<div class="card">

<h1>Forms</h1>

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="Enter password">

<label>City</label>
<select>
<option>Amman</option>
<option>Zarqa</option>
<option>Irbid</option>
<option>Aqaba</option>
<option>Madaba</option>
<option>Balqa</option>
<option>Jerash</option>
<option>Ajloun</option>
<option>Mafraq</option>
<option>Karak</option>
<option>Tafilah</option>
<option>Ma'an</option>
</select>

<button type="submit">Submit</button>

</form>

<br>

<a href="index.html">← Back to Home</a>

</div>

<footer style="
  margin-top: 60px;
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #0f172a, #111827);
  color: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
">

  <p style="margin: 5px; font-size: 16px; font-weight: 500;">
    HTML Learning Project By <strong style="color:#38bdf8;">Seraj Nawaiseh</strong>
  </p>

  <div style="
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 18px;
    flex-wrap: wrap;
  ">

    <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 16px; font-weight: bold;">
      Home
    </a>

    <a href="https://github.com/Sjnn" target="_blank" style="color: #38bdf8; font-size: 22px;">
      <i class="fab fa-github"></i>
    </a>

    <a href="https://www.linkedin.com/in/seraj-nawaiseh-b07305333/" target="_blank" style="color: #38bdf8; font-size: 22px;">
      <i class="fab fa-linkedin"></i>
    </a>

    <a href="https://www.instagram.com/se._nw/" target="_blank" style="color: #38bdf8; font-size: 22px;">
      <i class="fab fa-instagram"></i>
    </a>

  </div>

</footer>

<script>
function toggleTheme(){
document.body.classList.toggle('dark');
localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');

const icon = document.getElementById('themeToggle');
icon.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}

if(localStorage.getItem('theme')==='dark'){
document.body.classList.add('dark');
document.getElementById('themeToggle').textContent='☀️';
}
</script>

</body>

</html>
