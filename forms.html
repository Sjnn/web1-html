<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forms</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

input, select, button{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#0a66ff;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#004bb5;
}

a{
text-decoration:none;
color:#0a66ff;
}

</style>

</head>

<body>

<div class="card">

<h1>Forms</h1>

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="Enter password">

<label>City</label>
<select>
<option>Amman</option>
<option>Zarqa</option>
<option>Irbid</option>
<option>Aqaba</option>
<option>Madaba</option>
<option>Balqa</option>
<option>Jerash</option>
<option>Ajloun</option>
<option>Mafraq</option>
<option>Karak</option>
<option>Tafilah</option>
<option>Ma'an</option>

</select>

<button type="submit">Submit</button>

</form>

<br>

<a href="index.html">← Back to Home</a>

</div>

</body>

</html>
