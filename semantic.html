<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semantic HTML</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

header, nav, section, footer{
padding:10px;
margin-top:10px;
background:#eee;
border-radius:8px;
}

a{
text-decoration:none;
color:#0a66ff;
}

</style>

</head>

<body>

<div class="card">

<h1>Semantic HTML</h1>

<header>This is Header</header>

<nav>This is Navigation</nav>

<section>This is Section</section>

<footer>This is Footer</footer>

<br>

<a href="index.html">← Back to Home</a>

</div>

</body>

</html>
