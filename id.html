<head>

<title>ID Example</title>



<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

#title{
color:#0a66ff;
text-align:center;
}

#box1{
background:#ff4d4d;
color:white;
padding:15px;
margin-top:10px;
border-radius:8px;
}

#box2{
background:#4d79ff;
color:white;
padding:15px;
margin-top:10px;
border-radius:8px;
}

#box3{
background:#28a745;
color:white;
padding:15px;
margin-top:10px;
border-radius:8px;
}

.note{
margin-top:20px;
padding:15px;
background:#f1f1f1;
border-left:5px solid #0a66ff;
}

a{
text-decoration:none;
color:#0a66ff;
}

/* Dark mode styles */
body.dark{background:#121212;color:white;}
body.dark .card{background:#1e1e1e;}
body.dark .note{background:#2a2a2a;border-left-color:#4d79ff;}
#themeToggle{position:fixed;top:20px;right:20px;font-size:28px;background:none;border:none;cursor:pointer;z-index:1000;}

</style>

<link rel="icon" href="media/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

<button id="themeToggle" onclick="toggleTheme()">🌙</button>

<div class="card">

<h1 id="title">ID Example</h1>

<div id="box1">This is Box 1 (Red)</div>
<div id="box2">This is Box 2 (Blue)</div>
<div id="box3">This is Box 3 (Green)</div>

<div class="note">
Each box has a unique ID and different style.
</div>

<br>

<a href="index.html">← Back to Home</a>

</div>

<script>
function toggleTheme(){
document.body.classList.toggle('dark');
localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');
const icon=document.getElementById('themeToggle');
icon.textContent=document.body.classList.contains('dark')?'☀️':'🌙';
}
if(localStorage.getItem('theme')==='dark'){
document.body.classList.add('dark');
document.getElementById('themeToggle').textContent='☀️';
}
</script>

</body>
