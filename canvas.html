<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:50px;}
.card{max-width:800px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);text-align:center;}
a{text-decoration:none;color:#0a66ff;}
</style>
</head>

<body>

<div class="card">

<h1>Canvas Example</h1>

<canvas id="myCanvas" width="300" height="200" style="border:1px solid black;"></canvas>

<script>
let c = document.getElementById("myCanvas");
let ctx = c.getContext("2d");

// background
ctx.fillStyle = "#0a66ff";
ctx.fillRect(0, 0, 300, 200);

ctx.beginPath();
ctx.arc(150, 100, 50, 0, Math.PI * 2);
ctx.fillStyle = "white";
ctx.fill();
ctx.stroke();
</script>

<br><br>

<a href="index.html">← Back to Home</a>

</div>

</body>
</html>
