<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML vs XHTML</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:50px;}
.card{max-width:800px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);}
.box{background:#eee;padding:15px;border-radius:8px;margin-top:10px;}
a{text-decoration:none;color:#0a66ff;}
</style>

</head>

<body>

<div class="card">

<h1>HTML vs XHTML</h1>

<div class="box">
<strong>HTML:</strong><br>
- Flexible<br>
- Tags can be unclosed<br><br>

<strong>XHTML:</strong><br>
- Strict syntax<br>
- All tags must be closed<br>
- Lowercase required<br>
</div>

</div>

</body>

</html>
