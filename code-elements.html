<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Code Elements</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:50px;}
.card{max-width:800px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1);}
code, kbd, samp{background:#eee;padding:5px;border-radius:5px;}
</style>

</head>

<body>

<div class="card">

<h1>Computer Code</h1>

<p>Code: <code>console.log("Hello")</code></p>

<p>Keyboard: Press <kbd>Ctrl</kbd> + <kbd>S</kbd></p>

<p>Output: <samp>Hello World</samp></p>

</div>

</body>
</html>
