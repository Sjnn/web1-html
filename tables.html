<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tables</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:50px;
}

.card{

max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);

}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

th{
background:#0a66ff;
color:white;
}

a{
text-decoration:none;
color:#0a66ff;
}

</style>

</head>

<body>

<div class="card">

<h1>Tables</h1>

<table>

<tr>
<th>Name</th>
<th>Age</th>
<th>City</th>
</tr>

<tr>
<td>Ahmad</td>
<td>20</td>
<td>Aqaba</td>
</tr>

<tr>
<td>Sara</td>
<td>22</td>
<td>Amman</td>
</tr>

</table>

<br><br>

<a href="index.html">← Back to Home</a>

</div>

</body>

</html>
